# Modelo LLM
model:
  provider: "anthropic"
  model: "claude-sonnet-4-6"

# Comportamento do agente
agent:
  max_turns: 50
  reasoning_effort: "medium"

# Memória persistente
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 4000
  user_char_limit: 2500

# Configuração Slack (Socket Mode)
slack:
  bot_token: "${SLACK_BOT_TOKEN}"
  app_token: "${SLACK_APP_TOKEN}"

# Comportamento no Slack
platforms:
  slack:
    reply_to_mode: "first"
    extra:
      reply_in_thread: true
      reply_broadcast: false
      free_response_channels:
        - "C0ARL136B7E"

# Timezone
timezone: "America/Sao_Paulo"

# Compressão usa OpenRouter como provider auxiliar (evita 401 no Anthropic)
compression:
  enabled: true
  threshold_tokens: 8000
  target_tokens: 4000

# Aprovações (auto para uso no Slack)
approvals:
  mode: "off"
