name: Deploy Hermes Agent to Fly.io

on:
  push:
    branches:
      - claude/deploy-hermes-agent-gQdQD
    paths:
      - 'hermes-tropical-hub/**'
      - '.github/workflows/deploy-hermes.yml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Hermes Agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hermes-tropical-hub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create app if not exists
        run: flyctl apps list | grep -q "hermes-tropical-hub" || flyctl apps create hermes-tropical-hub --org personal
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create volume if not exists
        run: |
          flyctl volumes list -a hermes-tropical-hub | grep -q "hermes_data" || \
          flyctl volumes create hermes_data --size 1 --region gru -a hermes-tropical-hub --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Set app secrets
        run: |
          flyctl secrets set \
            SLACK_BOT_TOKEN="${{ secrets.SLACK_BOT_TOKEN }}" \
            SLACK_APP_TOKEN="${{ secrets.SLACK_APP_TOKEN }}" \
            ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}" \
            HUBSPOT_TOKEN="${{ secrets.HUBSPOT_TOKEN }}" \
            -a hermes-tropical-hub
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only -a hermes-tropical-hub
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
