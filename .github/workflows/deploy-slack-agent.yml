name: Deploy Slack Agent to Fly.io

on:
  workflow_dispatch:
  push:
    branches:
      - claude/slack-agent-viktor-vENyg
      - main
    paths:
      - 'slack_agent/**'
      - 'src/**'
      - 'Dockerfile.slack'
      - 'fly.slack.toml'
      - 'requirements-slack.txt'
      - 'pyproject.toml'

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: fly deploy --config fly.slack.toml --wait-timeout 180
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
