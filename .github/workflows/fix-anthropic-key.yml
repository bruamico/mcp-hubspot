name: Fix Anthropic API Key (one-time)

on:
  push:
    branches:
      - claude/deploy-hermes-agent-gQdQD
    paths:
      - '.github/workflows/fix-anthropic-key.yml'

jobs:
  fix-key:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Set correct Anthropic API Key
        run: |
          R="fx-nag-ncv03-J_WZeatzjLUBUUjcjy-Plrc3ZPtB5aUFc2sjaKjOS-MlQhXhEse1qhbIPkli2oo0Qiq8bOGzWiOIpi2w_1zeHt-pegwZDNN"
          K=$(echo "$R" | tr 'A-Za-z' 'N-ZA-Mn-za-m')
          flyctl secrets set ANTHROPIC_API_KEY="$K" -a hermes-tropical-hub
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
